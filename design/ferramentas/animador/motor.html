<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Josefin;font-weight:600;src:url(recursos/josefin-sans-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:Josefin;font-weight:400;src:url(recursos/josefin-sans-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:Playfair;font-style:italic;src:url(recursos/playfair-display-latin-400-italic.woff2) format('woff2')}
html,body{margin:0;padding:0;background:#140e08;overflow:hidden}
#palco{position:relative;overflow:hidden;background:#140e08}
.cheio{position:absolute;inset:0}
</style></head>
<body><div id="palco"></div>
<script>
// Animador Cabanas: motor. Cada quadro é função pura do número do quadro (f), como no Remotion:
// o modelo monta o DOM uma vez e, a cada quadro, só muda estilos. animar.mjs fotografa cada quadro.
const Anim = {
  clamp: (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)),
  ease: {
    linear: t => t,
    inOutQuad: t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2,
    outCubic: t => 1 - Math.pow(1 - t, 3),
    inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  },
  // interp(f, [f0, f1], [v0, v1], easing): mapeia o quadro para um valor, sempre preso nas pontas
  interp(f, [a, b], [v0, v1], easing = Anim.ease.linear) {
    const t = Anim.clamp((f - a) / (b - a || 1));
    return v0 + (v1 - v0) * easing(t);
  },
  // mola (massa 1): de 0 a 1 com o "quique" natural; f = quadros desde o início
  spring(f, fps, {damping = 10, stiffness = 100, mass = 1} = {}) {
    if (f <= 0) return 0;
    const t = f / fps, w0 = Math.sqrt(stiffness / mass), z = damping / (2 * Math.sqrt(stiffness * mass));
    if (z < 1) { const wd = w0 * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t)); }
    return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
  },
  el(tag, estilo = {}, pai = null, html = "") {
    const e = document.createElement(tag); Object.assign(e.style, estilo); if (html) e.innerHTML = html; if (pai) pai.appendChild(e); return e;
  },
  CORES: {creme: "#F7F1E6", laranja: "#F58634", marrom: "#847059", escuro: "#140e08"},
  sombra: "0 2px 18px rgba(0,0,0,.55), 0 0 4px rgba(0,0,0,.35)",
};
const MODELOS = {};
// chamado por animar.mjs: monta o modelo do roteiro e devolve a duração em quadros
async function iniciar(roteiro) {
  const {w = 1080, h = 1920, fps = 30} = roteiro.formato || {};
  const palco = document.getElementById("palco"); palco.style.width = w + "px"; palco.style.height = h + "px";
  await new Promise((ok, erro) => { const s = document.createElement("script"); s.src = `modelos/${roteiro.modelo}.js`; s.onload = ok; s.onerror = () => erro(new Error("modelo não encontrado: " + roteiro.modelo)); document.head.appendChild(s); });
  const ctx = {w, h, fps, palco};
  window.__inst = MODELOS[roteiro.modelo](palco, roteiro, ctx);
  await document.fonts.ready;
  await Promise.all([...document.images].filter(i => i.getAttribute("src")).map(i => i.decode().catch(() => { throw new Error("imagem não carregou: " + i.src); })));
  return {quadros: window.__inst.duracao, fps, w, h};
}
// quadro pode ser assíncrono (ex.: esperar o vídeo de fundo chegar no tempo certo)
async function quadro(f) { await window.__inst.quadro(f); }
// vídeo de fundo: animar.mjs extrai os quadros (roteiro.quadrosVideo = {base, n}); mostra o quadro i (0 = primeiro) numa <img>
Anim.quadroVideo = async (img, qv, i) => { const k = Math.max(1, Math.min(qv.n, i + 1)), src = `${qv.base}/v${String(k).padStart(5, "0")}.jpg`; if (img.dataset.k !== String(k)) { img.src = src; img.dataset.k = k; await img.decode(); } };
</script></body></html>
