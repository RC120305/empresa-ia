<!doctype html>
<!-- Modelo base 4:5 (1080 x 1350). Copie para design/pecas/<AAAA-MM-tema>/ e troque foto e textos.
     Os caminhos abaixo pressupõem a peça em design/pecas/<pasta>/. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../modelos/marca.css">
<style>
  /* Ajustes desta peça (ex.: recorte da foto) */
  .foto { object-position: center 60%; }
</style>
</head>
<body>
<div class="peca">
  <img class="foto" src="foto.jpg" alt="">
  <div class="veu-baixo"></div>

  <div class="bloco baixo">
    <p class="apoio">Cabana Master</p>
    <div class="linha"></div>
    <h1 class="titulo">Texto de <b>três</b> a <i>oito</i> palavras</h1>
  </div>

  <div class="assinatura">
    <div class="fio"></div>
    <span class="local">Bonito · MS</span>
    <img src="../../../contexto/marca/logo-hotel-cabanas-branco.png" alt="Hotel Cabanas">
  </div>
</div>
</body>
</html>
