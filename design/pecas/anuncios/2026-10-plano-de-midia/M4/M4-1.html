<!doctype html>
<!-- M4 · Casais e 55+ · carrossel 1/5 (capa) · feed45 e story · sem faixa · foto imagem_area_caiaque_rio_formoso (16g-Ga), vista aérea.
     Apoio + gancho curto (o gancho da matriz tinha 11 palavras). Texto sobre a mata da esquerda; o rio fica sem sombra. Nada sobre a cor da água. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../../modelos/marca.css">
<link rel="stylesheet" href="../anuncio-sem-faixa.css">
<link rel="stylesheet" href="../_ajustes-M-PR.css">
<style>.peca { --pos: 46% center; --pos-story: 46% center; --top: 100px; }</style>
</head>
<body>
<div class="peca">
  <img class="foto" src="foto-1.jpg" alt="">
  <span class="num-sf">1/5</span>
  <div class="bloco-sf cima" style="--forca: .66">
    <p class="apoio">Você já fez os passeios.</p>
    <div class="linha"></div>
    <h1 class="titulo">O <i>passeio</i> agora<br>é o <b>hotel</b></h1>
    <p class="fato">40 hectares entre o Formoso<br>e o Formosinho</p>
  </div>
  <div class="assin-sf">
    <span class="fio"></span>
    <span class="local">Bonito · MS</span>
    <img src="../../../../../contexto/marca/logo-hotel-cabanas-branco.png" alt="Hotel Cabanas">
  </div>
</div>
<script>if (innerHeight > innerWidth * 1.5) document.querySelector('.peca').classList.add('story');</script>
</body>
</html>
