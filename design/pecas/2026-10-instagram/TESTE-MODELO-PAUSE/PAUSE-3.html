<!doctype html>
<!-- Teste "Pause a tela" 3 | 9:16 (1080 x 1920) -->
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../modelos/marca.css">
<style>
.foto { object-position: 33% center; }
.ceu { position: absolute; inset: 0 0 auto 0; height: 1150px; background: linear-gradient(to bottom, rgba(20,14,8,.45) 0%, rgba(20,14,8,.45) 55%, rgba(20,14,8,0) 100%); }
.moldura { position: absolute; left: 50px; right: 50px; top: 170px; bottom: 200px; border: 3px solid var(--creme); border-radius: 46px;
  -webkit-mask: linear-gradient(to right, #000 calc(50% - 130px), transparent calc(50% - 130px), transparent calc(50% + 130px), #000 calc(50% + 130px)) top / 100% 12px no-repeat, linear-gradient(#000, #000) 0 12px / 100% 100% no-repeat;
  mask: linear-gradient(to right, #000 calc(50% - 130px), transparent calc(50% - 130px), transparent calc(50% + 130px), #000 calc(50% + 130px)) top / 100% 12px no-repeat, linear-gradient(#000, #000) 0 12px / 100% 100% no-repeat; }
.selo { position: absolute; left: 50%; top: 170px; transform: translate(-50%, -50%); padding: 0 26px; }
.selo img { height: 118px; display: block; filter: drop-shadow(0 2px 8px rgba(0,0,0,.35)); }
.corte { position: absolute; left: 50%; top: 168px; width: 200px; height: 8px; transform: translateX(-50%); background: transparent; }
.texto { position: absolute; left: 90px; right: 90px; top: 470px; text-align: center; }
.texto h1 { font-family: "Playfair Display", serif; font-style: italic; font-weight: 700; font-size: 92px; line-height: 1.08; text-shadow: 0 3px 24px rgba(0,0,0,.35); }
.texto p { margin-top: 34px; font-family: "Josefin Sans", sans-serif; font-weight: 400; font-size: 46px; line-height: 1.25; text-shadow: 0 2px 16px rgba(0,0,0,.6), 0 0 4px rgba(0,0,0,.3); }
.pe { position: absolute; inset: auto 0 0 0; height: 760px; background: linear-gradient(to top, rgba(20,14,8,.62), rgba(20,14,8,.3) 55%, rgba(20,14,8,0)); }
.etiqueta { position: absolute; left: 120px; right: 120px; bottom: 310px; text-align: center; }
.etiqueta span { font-family: "Josefin Sans", sans-serif; font-weight: 600; font-size: 38px; line-height: 1.3; letter-spacing: .08em; text-transform: uppercase; color: var(--creme);
  text-shadow: 0 2px 16px rgba(0,0,0,.6), 0 0 4px rgba(0,0,0,.35); }
</style></head>
<body><div class="peca story">
  <img class="foto" src="fotos/dois-rios.jpg" alt="">
  <div class="ceu"></div>
  <div class="pe"></div>
  <div class="moldura"></div>
  <div class="selo"><img src="../../../../contexto/marca/logo-hotel-cabanas-branco.png" alt="Hotel Cabanas"></div>
  <div class="texto"><h1>Pause a tela<br>e descubra</h1><p>Qual será a sua próxima<br>pausa em Bonito?</p></div>
  <div class="etiqueta"><span>Bonito sem pressa,<br>entre dois rios</span></div>
</div></body></html>
