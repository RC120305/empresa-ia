<!doctype html>
<!-- Story 9:16 (1080 x 1920). Boia cross em família. Foto: 2024.12 Hotel Cabanas Print 080.jpg (pasta Boia Cross). -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../modelos/marca.css">
<style>
  /* Recorte: a fila de boias (diagonal) fica no centro-direita; a mata e o rio da esquerda recebem a faixa */
  .foto { object-position: 62% center; }
  /* Foto clara e cheia de detalhe: faixa marrom leva título E assinatura (legível no celular) */
  .story .bloco.baixo { right: auto; bottom: var(--topo-seguro); }
  .faixa { width: 560px; padding: 30px 36px 30px; }
  .faixa .linha { margin: 18px 0 20px; }
  .faixa .titulo { font-size: 76px; text-shadow: none; }
  .regra { font-family: "Josefin Sans", sans-serif; font-weight: 400; font-size: 21px; letter-spacing: .2em; text-transform: uppercase; margin-top: 20px; }
  .faixa .assinatura { position: static; margin-top: 30px; gap: 22px; }
  .faixa .assinatura .local { font-size: 20px; letter-spacing: .45em; }
  .faixa .assinatura img { height: 64px; }
</style>
</head>
<body>
<div class="peca story">
  <img class="foto" src="foto.jpg" alt="">

  <div class="bloco baixo">
    <div class="faixa">
      <p class="apoio">Rio Formoso</p>
      <div class="linha"></div>
      <h1 class="titulo">Boia cross<br><b>em</b> <i>família</i></h1>
      <p class="regra">A partir de 6 anos e 1,15 m</p>
      <div class="assinatura">
        <div class="fio"></div>
        <span class="local">Bonito · MS</span>
        <img src="../../../contexto/marca/logo-hotel-cabanas-branco.png" alt="Hotel Cabanas">
      </div>
    </div>
  </div>
</div>
</body>
</html>
