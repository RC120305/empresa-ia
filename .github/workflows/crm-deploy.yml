name: CRM - publicar no Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'crm/app/**'
      - 'crm/gilberto/prompt-sistema.md'
      - 'crm/gilberto/base-conhecimento.md'
      - 'crm/gilberto/ferramentas.json'
      - 'crm/simulador-silbeck/**'
      - 'contexto/hotel-operacional.md'
      - '.github/workflows/crm-deploy.yml'
  workflow_dispatch:

concurrency:
  group: crm-deploy
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write   # federação de identidade com o Google (sem chave)

env:
  PROJECT_ID: cabanas-crm
  REGION: southamerica-east1
  SERVICE: crm
  IMAGE: southamerica-east1-docker.pkg.dev/cabanas-crm/crm/crm

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # o repositório é grande (fotos e artes); baixa só o CRM e o conhecimento do Gilberto
          sparse-checkout: |
            crm/app/
            crm/gilberto/
            crm/simulador-silbeck/
            contexto/hotel-operacional.md
          sparse-checkout-cone-mode: false
          filter: blob:none

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dependências
        run: npm ci --prefix crm/app

      - name: ffmpeg (recorte das fotos e áudios longos, usado nos testes)
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg)

      - name: Testes do CRM
        run: node crm/app/teste.js

      - name: Autenticar no Google Cloud (sem chave)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/377803250649/locations/global/workloadIdentityPools/github/providers/github-provider
          service_account: github-deploy@cabanas-crm.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Montar e enviar a imagem
        run: |
          cp crm/gilberto/prompt-sistema.md crm/gilberto/base-conhecimento.md crm/gilberto/ferramentas.json contexto/hotel-operacional.md crm/app/conhecimento/
          mkdir -p crm/app/simulador-silbeck && cp -r crm/simulador-silbeck/src crm/simulador-silbeck/dados crm/app/simulador-silbeck/
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -t "${IMAGE}:${GITHUB_SHA}" crm/app
          docker push "${IMAGE}:${GITHUB_SHA}"

      - name: Publicar no Cloud Run
        run: |
          gcloud run deploy "${SERVICE}" \
            --image "${IMAGE}:${GITHUB_SHA}" \
            --region "${REGION}" \
            --service-account "crm-runtime@${PROJECT_ID}.iam.gserviceaccount.com" \
            --set-env-vars "VERSAO=${GITHUB_SHA::7},SUPABASE_URL=https://gpvhnclniolxxxjkslkf.supabase.co,SILBECK_MODO=real,BB_MODO=simulador,RESERVAS_AUTO=liberadas" \
            --set-secrets "META_APP_SECRET=meta-app-secret:latest,META_VERIFY_TOKEN=meta-verify-token:latest,SUPABASE_SECRET_KEY=supabase-secret-key:latest,SUPABASE_PUBLISHABLE_KEY=supabase-publishable-key:latest,META_WHATSAPP_TOKEN=meta-whatsapp-token:latest,ANTHROPIC_API_KEY=anthropic-api-key:latest" \
            --network crm-vpc --subnet crm-sp --vpc-egress all-traffic \
            --allow-unauthenticated \
            --min-instances 0 --max-instances 1 --memory 1Gi --timeout 600 \
            --quiet

      - name: Conferir /saude
        run: |
          URL="$(gcloud run services describe "${SERVICE}" --region "${REGION}" --format='value(status.url)')"
          echo "Endereço: ${URL}"
          sleep 8  # dá tempo de o servidor descobrir o IP de saída
          curl -fsS "${URL}/saude"
